<!DOCTYPE html>
<html lang="nl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HARDWIG: EMPIRE MODE</title>
<meta name="description" content="Kempen Vice — persoonlijk operating system voor netwerk, missies en empire value.">

<!--
====================================================================================
  HARDWIG: EMPIRE MODE — REFERENTIE-PROTOTYPE (v1)
  Kempen Vice · mobile-first · 390–430px primair
====================================================================================

  DOEL VAN DIT BESTAND
  Dit is één zelfstandig bestand (vanilla JS) dat bewust gestructureerd is als de
  React/TS-app die eruit moet groeien. Elke sectie hieronder is gemarkeerd met het
  bestandspad dat ze in de echte app krijgt. Poort per blok, niet per scherm.

  DOELSTRUCTUUR (Vite + React + TS + Tailwind + Framer Motion + Leaflet)

    src/
      styles/tokens.css            <- [A] DESIGN TOKENS
      styles/global.css            <- [B] BASE + COMPONENT CSS  (of Tailwind @layer)
      types/index.ts               <- [C] DATAMODELLEN
      data/seed.ts                 <- [D] DEMO-DATA
      store/useStore.ts            <- [E] STATE + LOCALSTORAGE (Zustand aanbevolen)
      components/ui/               <- [F] UI-PRIMITIEVEN (Card, Button, Progress, Chip...)
      components/AppShell.tsx      <- [G] SHELL + BOTTOM NAV + NYX FAB
      components/Sheet.tsx         <- [G] BOTTOM SHEET
      features/map/MapEngine.ts    <- [H] KAARTMOTOR (projectie, tiles, markers)
      screens/HomeScreen.tsx       <- [I]
      screens/MapScreen.tsx        <- [J]
      screens/MissionsScreen.tsx   <- [K]
      screens/MissionDetail.tsx    <- [L]
      screens/JournalScreen.tsx    <- [M]
      screens/MonthlyWrap.tsx      <- [N]
      screens/ProfileScreen.tsx    <- [O]
      features/nyx/NyxSheet.tsx    <- [P]
      app/router.tsx               <- [Q] ROUTES

  ROUTES (hash-based hier, react-router in de echte app)
    #/home  #/map  #/missions  #/mission/:id  #/journal  #/wrap/:monthId  #/profile

  KAART
  De kaartmotor projecteert echte lat/lng via Web Mercator en probeert echte
  OSM-tegels te laden. Faalt dat (offline/CSP), dan valt ze terug op een eigen
  vectorlaag met echte coördinaten. Zie blok [H] voor het inhaakpunt naar
  Leaflet/MapLibre. Geen enkele kaart is een afbeelding.

  ASSETS
  Alleen eigen SVG, CSS-gradients en de door de gebruiker aangeleverde Nyx-portret.
  Geen externe of gelicentieerde game-assets.
====================================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* =================================================================================
   [A] DESIGN TOKENS  ->  src/styles/tokens.css
   ================================================================================= */
:root{
  color-scheme: dark;

  /* Kern */
  --night:#0B0907;
  --charcoal:#171411;
  --charcoal-2:#1F1B16;
  --gold:#C9A34E;
  --gold-soft:#E4C782;
  --gold-deep:#8A6C2A;
  --ivory:#F6ECDF;

  /* Accenten */
  --amber:#FF9A3C;
  --coral:#F05252;
  --burgundy:#681C35;
  --jade:#4FBF8B;

  /* Afgeleid */
  --ink-1:var(--ivory);
  --ink-2:rgba(246,236,223,.72);
  --ink-3:rgba(246,236,223,.48);
  --ink-4:rgba(246,236,223,.30);
  --line:rgba(201,163,78,.20);
  --line-soft:rgba(246,236,223,.10);
  --surface:linear-gradient(180deg,#191511 0%,#131010 100%);
  --surface-raised:linear-gradient(180deg,#221D17 0%,#171411 100%);
  --gold-grad:linear-gradient(180deg,#E9CE8C 0%,#C9A34E 52%,#A8813A 100%);
  --sunset:linear-gradient(180deg,#2A1A10 0%,#6B3A18 46%,#C9702B 78%,#FF9A3C 100%);

  /* Ruimte (4pt) */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;

  /* Radius */
  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:20px; --r-pill:999px;

  /* Layout */
  --col:430px;
  --nav-h:72px;
  --safe-b:env(safe-area-inset-bottom,0px);

  /* Elevatie */
  --glow-gold:0 0 0 1px rgba(201,163,78,.35), 0 8px 28px rgba(201,163,78,.14);
  --shadow-sheet:0 -18px 50px rgba(0,0,0,.65);

  /* Motion */
  --t-fast:140ms cubic-bezier(.2,.7,.3,1);
  --t-mid:260ms cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:var(--night);
  color:var(--ink-1);
  font-family:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.5;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
/* Ambient achtergrond op breed scherm — de kolom blijft mobiel */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(120% 60% at 50% 0%, rgba(201,163,78,.10), transparent 60%),
    radial-gradient(80% 50% at 50% 100%, rgba(104,28,53,.18), transparent 70%),
    var(--night);
}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
ul{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--gold-soft);outline-offset:2px;border-radius:6px}

/* =================================================================================
   [B] BASE + COMPONENTEN  ->  src/styles/global.css
   ================================================================================= */

/* --- Shell ---------------------------------------------------------------- */
.app{
  position:relative;z-index:1;
  width:100%;max-width:var(--col);margin:0 auto;min-height:100dvh;
  background:var(--night);
  box-shadow:0 0 0 1px rgba(201,163,78,.12), 0 30px 120px rgba(0,0,0,.8);
}
.view{padding-bottom:calc(var(--nav-h) + var(--safe-b) + 28px)}

/* --- Typografie ----------------------------------------------------------- */
.display{
  font-family:Anton,Impact,sans-serif;font-weight:400;
  letter-spacing:.01em;line-height:.94;text-transform:uppercase;
}
.d-xl{font-size:34px}
.d-lg{font-size:27px}
.d-md{font-size:21px}
.d-sm{font-size:17px}
.eyebrow{
  font-size:10px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;
  color:var(--gold);
}
.eyebrow.muted{color:var(--ink-3)}
.meta{font-size:11px;color:var(--ink-3);letter-spacing:.04em}
.body{font-size:13.5px;color:var(--ink-2);line-height:1.55}
.script{font-family:Caveat,cursive;font-size:22px;color:var(--gold-soft);line-height:1}
.num{font-variant-numeric:tabular-nums}

/* --- Hero ----------------------------------------------------------------- */
.hero{position:relative;overflow:hidden;padding:18px 16px 16px;isolation:isolate}
.hero-art{position:absolute;inset:0;z-index:-1}
.hero-art svg{width:100%;height:100%;display:block}
.hero-fade{position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(11,9,7,.15) 0%,rgba(11,9,7,.55) 55%,var(--night) 100%)}
.hero-corner{position:absolute;top:16px;right:16px;text-align:right;max-width:120px}
.hero-corner .eyebrow{display:block;line-height:1.5;color:rgba(246,236,223,.55);font-size:8.5px}

/* --- Card ----------------------------------------------------------------- */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-lg);
  padding:14px;
  position:relative;overflow:hidden;
}
.card.flat{background:var(--charcoal);}
.card.tap{transition:transform var(--t-fast),border-color var(--t-fast)}
.card.tap:active{transform:scale(.985);border-color:rgba(201,163,78,.45)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head .t{display:flex;align-items:center;gap:8px}
.section{padding:0 16px;margin-top:16px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stack{display:grid;gap:10px}

/* --- Knoppen -------------------------------------------------------------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:44px;padding:0 16px;border-radius:var(--r-md);
  font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  transition:transform var(--t-fast),filter var(--t-fast);
}
.btn:active{transform:scale(.97)}
.btn-gold{background:var(--gold-grad);color:#1A1206;box-shadow:0 6px 18px rgba(201,163,78,.22)}
.btn-ghost{border:1px solid var(--line);color:var(--ink-1);background:rgba(255,255,255,.02)}
.btn-quiet{color:var(--ink-2);border:1px solid var(--line-soft)}
.btn-block{width:100%}
.btn-sm{min-height:38px;font-size:11px;padding:0 12px}
.btn-icon{width:44px;min-height:44px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}

/* --- Chips / tabs --------------------------------------------------------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:0 16px 2px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;
  height:38px;padding:0 14px;border-radius:var(--r-pill);
  border:1px solid var(--line);background:rgba(255,255,255,.02);
  font-size:12px;font-weight:600;color:var(--ink-2);white-space:nowrap;
  transition:all var(--t-fast);
}
.chip[aria-pressed="true"],.chip.is-on{background:var(--gold-grad);color:#1A1206;border-color:transparent;font-weight:800}
.chip .cnt{
  display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 5px;
  border-radius:var(--r-pill);background:rgba(0,0,0,.28);font-size:10px;font-weight:800;
}
.chip[aria-pressed="true"] .cnt{background:rgba(0,0,0,.22);color:#1A1206}

.tag{
  display:inline-block;padding:3px 8px;border-radius:5px;border:1px solid var(--line);
  font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-soft);
}
.tag.alt{color:var(--ink-3);border-color:var(--line-soft)}
.tag.warn{color:var(--amber);border-color:rgba(255,154,60,.35)}
.tag.risk{color:var(--coral);border-color:rgba(240,82,82,.35)}

/* --- Progress ------------------------------------------------------------- */
.bar{height:8px;border-radius:var(--r-pill);background:rgba(246,236,223,.10);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:inherit;background:var(--gold-grad);
  width:0;transition:width 900ms cubic-bezier(.2,.7,.3,1)}
.bar.thin{height:5px}
.bar.coral > i{background:linear-gradient(90deg,#F0857A,#F05252)}
.bar.jade > i{background:linear-gradient(90deg,#7FD9B0,#4FBF8B)}

/* --- Reward pills --------------------------------------------------------- */
.pill{
  display:flex;align-items:center;gap:9px;padding:9px 12px;
  border:1px solid var(--line);border-radius:var(--r-md);background:rgba(0,0,0,.25);
}
.pill .lab{font-size:8.5px;letter-spacing:.16em;color:var(--ink-3);text-transform:uppercase}
.pill .val{font-size:13px;font-weight:800;letter-spacing:.02em}
.pill .ico{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;
  border:1px solid var(--line);color:var(--gold)}

/* --- Media / beeldvlakken (eigen gradient-composities, geen stockbeeld) --- */
.plate{position:relative;border-radius:var(--r-md);overflow:hidden;background:var(--charcoal-2)}
.plate svg{position:absolute;inset:0;width:100%;height:100%}
.plate.fill{position:absolute;inset:0;width:100%;height:100%;border-radius:inherit}
.plate.sq{width:96px;height:112px;flex:0 0 auto}
.plate.wide{width:100%;height:76px}
.plate .lbl{position:absolute;left:8px;bottom:6px;font-size:8px;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(246,236,223,.65)}

/* --- Bottom nav ----------------------------------------------------------- */
.nav{
  position:fixed;bottom:0;left:50%;transform:translateX(-50%);
  width:min(100%,var(--col));z-index:40;
  height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  background:linear-gradient(180deg,rgba(11,9,7,.86),rgba(11,9,7,.98));
  backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
}
.nav button{
  display:grid;justify-items:center;gap:5px;height:100%;min-height:44px;color:var(--ink-3);
  font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  position:relative;transition:color var(--t-fast);
}
.nav button[aria-current="page"]{color:var(--gold)}
.nav button[aria-current="page"]::after{
  content:"";position:absolute;bottom:10px;width:20px;height:2px;border-radius:2px;background:var(--gold)}
.nav svg{width:22px;height:22px}

/* --- Nyx FAB -------------------------------------------------------------- */
.nyx-fab{
  position:fixed;z-index:45;right:calc(50% - min(50%, var(--col)/2) + 14px);
  bottom:calc(var(--nav-h) + var(--safe-b) + 14px);
  width:64px;height:64px;border-radius:50%;
  box-shadow:0 0 0 2px var(--gold), 0 0 26px rgba(201,163,78,.40), 0 10px 24px rgba(0,0,0,.6);
  overflow:visible;
}
.nyx-fab img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.nyx-fab .bubble{
  position:absolute;top:-8px;right:-6px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;background:var(--night);border:1px solid var(--gold);color:var(--gold)}
.nyx-fab:active{transform:scale(.94)}
.nyx-fab.pulse::after{
  content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(201,163,78,.5);
  animation:ring 2.6s ease-out infinite}
@keyframes ring{0%{opacity:.7;transform:scale(.96)}100%{opacity:0;transform:scale(1.18)}}

/* --- Sheets --------------------------------------------------------------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(6,5,4,.66);backdrop-filter:blur(3px);
  opacity:0;transition:opacity var(--t-mid)}
.scrim.open{opacity:1}
.sheet{
  position:fixed;z-index:51;bottom:0;left:50%;transform:translate(-50%,102%);
  width:min(100%,var(--col));max-height:88dvh;display:flex;flex-direction:column;
  background:var(--surface-raised);border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-xl) var(--r-xl) 0 0;box-shadow:var(--shadow-sheet);
  transition:transform var(--t-mid);
  padding-bottom:var(--safe-b);
}
.sheet.open{transform:translate(-50%,0)}
.sheet .grip{width:40px;height:4px;border-radius:2px;background:var(--ink-4);margin:10px auto 2px;flex:0 0 auto}
.sheet .sheet-body{overflow:auto;padding:12px 16px 18px}
.sheet .sheet-foot{padding:10px 16px 14px;border-top:1px solid var(--line-soft);flex:0 0 auto}

/* --- Formulier ------------------------------------------------------------ */
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.input{
  width:100%;min-height:44px;padding:11px 12px;border-radius:var(--r-md);
  background:rgba(0,0,0,.35);border:1px solid var(--line-soft);color:var(--ink-1);font-size:14px;
}
.input:focus{border-color:var(--gold);outline:none}
textarea.input{resize:vertical;min-height:76px;line-height:1.5}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{
  min-height:40px;padding:0 12px;border-radius:var(--r-pill);border:1px solid var(--line);
  font-size:11px;font-weight:600;color:var(--ink-2)}
.seg button.is-on{background:var(--gold-grad);color:#1A1206;border-color:transparent;font-weight:800}

/* --- Kaart ---------------------------------------------------------------- */
.mapwrap{position:relative;height:clamp(340px,52dvh,520px);background:#0E0C0A;overflow:hidden;touch-action:none}
#mapCanvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.marker-layer{position:absolute;inset:0;pointer-events:none}
.mk{
  position:absolute;transform:translate(-50%,-100%);pointer-events:auto;
  width:38px;height:44px;display:grid;place-items:start center;
  filter:drop-shadow(0 3px 6px rgba(0,0,0,.7));
  transition:filter var(--t-fast);
}
.mk svg{width:38px;height:44px;overflow:visible}
.mk.sel{z-index:5;filter:drop-shadow(0 0 10px rgba(201,163,78,.75)) drop-shadow(0 3px 6px rgba(0,0,0,.7))}
.mk.done{opacity:.45}
.mk.locked{opacity:.5}
.mk .glow{animation:pulseGlow 2.8s ease-in-out infinite;transform-origin:center}
@keyframes pulseGlow{0%,100%{opacity:.25}50%{opacity:.6}}
.map-ctl{position:absolute;right:12px;display:grid;gap:8px;z-index:6}
.map-btn{
  width:44px;height:44px;display:grid;place-items:center;border-radius:12px;
  background:rgba(14,12,10,.86);border:1px solid var(--line);color:var(--ivory);
  backdrop-filter:blur(6px)}
.map-badge{
  position:absolute;left:12px;bottom:12px;z-index:6;display:flex;align-items:center;gap:8px;
  padding:7px 11px;border-radius:10px;background:rgba(14,12,10,.86);border:1px solid var(--line);
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.map-scale{position:absolute;right:12px;bottom:12px;z-index:6;font-size:10px;color:var(--ink-2);text-align:right}
.map-scale .rule{height:6px;border:1px solid var(--ink-3);border-top:0;margin-top:3px}
.map-hint{position:absolute;left:12px;top:12px;z-index:6;font-size:10px;color:var(--ink-3);
  background:rgba(14,12,10,.8);border:1px solid var(--line-soft);padding:5px 9px;border-radius:8px}

/* --- Journal -------------------------------------------------------------- */
.tl{position:relative;padding-left:56px}
.tl::before{content:"";position:absolute;left:44px;top:6px;bottom:24px;width:1px;
  background:linear-gradient(180deg,var(--gold),rgba(201,163,78,.05))}
.tl-item{position:relative;margin-bottom:10px}
.tl-item .tl-time{position:absolute;left:-56px;top:12px;width:34px;text-align:right;
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.tl-item .tl-dot{position:absolute;left:-13px;top:16px;width:9px;height:9px;border-radius:50%;
  background:var(--night);border:2px solid var(--gold)}
.tl-ico{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
  display:grid;place-items:center;color:var(--gold);flex:0 0 auto}
.media-row{display:flex;gap:6px;margin-top:9px}
.media-row .plate{width:74px;height:52px;flex:0 0 auto}
.media-more{width:44px;height:52px;border-radius:var(--r-sm);border:1px dashed var(--line);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-3)}

.composer{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--nav-h) + var(--safe-b) + 8px);
  width:min(100% - 24px,calc(var(--col) - 24px));z-index:38;
  display:flex;align-items:flex-end;gap:8px;padding:8px 8px 8px 12px;
  background:rgba(23,20,17,.96);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 14px 34px rgba(0,0,0,.6);backdrop-filter:blur(10px);
}
.composer textarea{
  flex:1;background:none;border:0;outline:none;resize:none;max-height:92px;
  font-size:13.5px;line-height:1.45;color:var(--ink-1);padding:10px 0 8px}
.composer textarea::placeholder{color:var(--ink-4)}
.composer .ic{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--ink-3)}
.composer .ic:active{color:var(--gold)}
.composer .send{width:44px;height:40px;border-radius:10px;background:var(--gold-grad);
  display:grid;place-items:center;color:#1A1206}

/* --- Stats / profiel ------------------------------------------------------ */
.statrow{display:grid;grid-template-columns:22px 92px 1fr auto;align-items:center;gap:10px;padding:6px 0}
.statrow .nm{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.statrow .vl{font-size:12px;font-weight:800;min-width:52px;text-align:right}
.statrow .vl small{color:var(--ink-4);font-weight:600}
.metric{display:grid;gap:4px;padding:12px 10px;border:1px solid var(--line);border-radius:var(--r-md);
  background:rgba(0,0,0,.25);text-align:center}
.metric .v{font-family:Anton,sans-serif;font-size:24px;color:var(--gold-soft);letter-spacing:.02em}
.metric .k{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);line-height:1.35}
.ach{display:grid;gap:6px;justify-items:center;text-align:center;width:88px;flex:0 0 auto}
.ach .hex{width:56px;height:62px;display:grid;place-items:center;color:var(--gold)}
.ach.locked{opacity:.4}
.ach .an{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.ach .ad{font-size:8.5px;color:var(--ink-4);letter-spacing:.08em;text-transform:uppercase}

/* --- Wrap ----------------------------------------------------------------- */
.wrap-hero{position:relative;padding:26px 16px 18px;overflow:hidden}
.wrap-q{border-left:2px solid var(--gold);padding:2px 0 2px 12px;margin:10px 0}
.wrap-kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.wrap-block{padding:12px 0;border-top:1px solid var(--line-soft)}
.wrap-block .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.wrap-block .v{font-size:14px;line-height:1.5}

/* --- Toast ---------------------------------------------------------------- */
.toast{
  position:fixed;left:50%;transform:translate(-50%,16px);z-index:60;
  bottom:calc(var(--nav-h) + var(--safe-b) + 92px);
  padding:11px 16px;border-radius:var(--r-pill);
  background:var(--gold-grad);color:#1A1206;font-size:12px;font-weight:800;letter-spacing:.06em;
  box-shadow:0 10px 26px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:all var(--t-mid)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* --- XP-flits bij missievoltooiing ---------------------------------------- */
.goldflash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;
  background:radial-gradient(60% 40% at 50% 50%,rgba(201,163,78,.30),transparent 70%)}
.goldflash.go{animation:flash 900ms ease-out}
@keyframes flash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

/* --- Reduced motion ------------------------------------------------------- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
    transition-duration:.001ms!important}
}
/* --- Breed scherm: kolom blijft mobiel ------------------------------------ */
@media (min-width:900px){
  .app{min-height:100dvh;border-left:1px solid rgba(201,163,78,.12);border-right:1px solid rgba(201,163,78,.12)}
}
</style>

<script>
/* =================================================================================
   [E] STATE + PERSISTENTIE  ->  src/store/useStore.ts
   Bewust één simpele store met expliciete mutaties. In de React-app: Zustand met
   dezelfde acties (persist-middleware op localStorage, zelfde sleutel/versie).
   ================================================================================= */
const STORAGE_KEY = 'hardwig.empire.v1';

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    if (!parsed || parsed.version !== SEED.version) return null;   // migratie: val terug op seed
    return parsed;
  } catch (e) { console.warn('localStorage niet beschikbaar, we draaien op seed-data.', e); return null; }
}
function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S)); }
  catch (e) { /* private mode of quota: prototype blijft werken in geheugen */ }
}
const S = loadState() || JSON.parse(JSON.stringify(SEED));
S.ui = { tab:'home', missionFilter:'active', journalFilter:'today', mapFilter:'all',
         selectedPin:null, activeMissionId:'m-connector' };

/* Selectors */
const missionById = id => S.missions.find(m => m.id === id);
const contactById = id => S.contacts.find(c => c.id === id);
const activeMissions  = () => S.missions.filter(m => m.status === 'active');
const featuredMission = () => S.missions.find(m => m.id === S.ui.activeMissionId) || activeMissions()[0];
const statByKey = k => S.user.stats.find(s => s.key === k);
const doneCount = m => m.objectives.filter(o => !o.optional && o.done).length;
const reqCount  = m => m.objectives.filter(o => !o.optional).length;

/* Acties ------------------------------------------------------------------- */
function toggleObjective(missionId, objId) {
  const m = missionById(missionId); if (!m) return;
  const o = m.objectives.find(x => x.id === objId); if (!o) return;
  o.done = !o.done;
  if (doneCount(m) === reqCount(m) && m.status === 'active') completeMission(m.id);
  persist();
}
function completeMission(id) {
  const m = missionById(id); if (!m || m.status === 'completed') return;
  m.status = 'completed';
  m.objectives.forEach(o => { if (!o.optional) o.done = true; });
  S.user.xp += m.xp; S.user.lifetimeXp += m.xp;
  while (S.user.xp >= S.user.xpToNext) { S.user.xp -= S.user.xpToNext; S.user.level += 1; }
  const st = statByKey(m.statReward.key);
  if (st) st.value = clamp(st.value + m.statReward.amount, 0, 100);
  S.user.counters.missionsCompleted += 1;
  if (m.kind === 'boss') S.user.counters.bossCompleted += 1;
  if (S.ui.activeMissionId === id) {
    const next = activeMissions()[0]; S.ui.activeMissionId = next ? next.id : id;
  }
  goldFlash(); toast(`Missie voltooid · +${m.xp} XP`);
  persist();
}
function acceptSuggestion(sugId) {
  const sug = S.nyxSuggestions.find(s => s.id === sugId); if (!sug) return null;
  const m = Object.assign({
    id: uid('m'), title: sug.title, status:'active', xp: sug.xp, source:'nyx',
    objectives: [], people: [], featured:false
  }, JSON.parse(JSON.stringify(sug.blueprint)));
  m.id = uid('m'); m.title = sug.title; m.status = 'active'; m.xp = sug.xp; m.source = 'nyx';
  S.missions.unshift(m);
  S.nyxSuggestions = S.nyxSuggestions.filter(s => s.id !== sugId);
  persist();
  return m;
}
function addJournalEntry({ text, media = [] }) {
  const firstLine = text.split(/[.\n]/)[0].trim();
  const entry = {
    id: uid('j'), ts: Date.now(), icon: 'edit',
    title: firstLine.length > 46 ? firstLine.slice(0, 44) + '…' : (firstLine || 'Quick note'),
    text: text.trim(), tags:['QUICK NOTE'], people:[], media, extraMedia:0
  };
  const people = S.contacts.filter(c => new RegExp('\\b' + c.name + '\\b', 'i').test(text));
  entry.people = people.map(c => c.id);
  if (people.length) entry.tags.push('NETWORK');
  S.journal.unshift(entry); persist();
  return entry;
}
function addPin(pin) {
  const p = Object.assign({ id: uid('pin'), state:'default', custom:true }, pin);
  S.pins.push(p); persist(); return p;
}
function removePin(id) { S.pins = S.pins.filter(p => p.id !== id); persist(); }

function generateWrap() {
  const id = monthId(Date.now());
  const entries = S.journal.filter(j => monthId(j.ts) === id);
  const done = S.missions.filter(m => m.status === 'completed');
  const people = new Set(); entries.forEach(e => (e.people || []).forEach(p => people.add(p)));
  const wrap = {
    id, label: monthLabel(id), year: new Date().getFullYear(),
    events: entries.filter(e => (e.tags || []).includes('EVENT') || (e.tags || []).includes('NETWORK')).length,
    newContacts: 11, missionsCompleted: done.length,
    deltas: { network:9, authority:6, execution:4 },
    empireDelta: 6900,
    biggestWin:'De eerste gesprekken kwamen naar u toe in plaats van andersom.',
    biggestMistake:'Te lang aan het thema gesleuteld voor u Pieter belde.',
    bestRelationship:'Pieter Jan — capaciteitsprobleem dat u kunt oplossen.',
    keyDecision:'Tarief op €180/u houden, ook bij twijfel.',
    bestMission:'The Connector',
    timeSink:'Website en tooling.',
    whatChanged:'Netwerk is van uw zwakste naar uw sterkste beweging gegaan.',
    nyx:'September was de maand waarin u eindelijk uit het safehouse kwam.',
    generatedAt: Date.now(),
    entryIds: entries.slice(0, 6).map(e => e.id)
  };
  S.wraps = [wrap, ...S.wraps.filter(w => w.id !== id)];
  persist(); return wrap;
}

  { n:'Tremelo',    lat:50.9931, lng:4.7047, rank:2 },
  { n:'Keerbergen', lat:50.9986, lng:4.6386, rank:2 },
  { n:'Bonheiden',  lat:51.0167, lng:4.5333, rank:2 },
  { n:'Haacht',     lat:50.9764, lng:4.6333, rank:2 },
  { n:'Rotselaar',  lat:50.9500, lng:4.7167, rank:2 },
  { n:'Nijlen',     lat:51.1667, lng:4.6667, rank:2 },
  { n:'Herenthout', lat:51.1333, lng:4.7500, rank:2 },
  { n:'Berlaar',    lat:51.1167, lng:4.6500, rank:2 },
  { n:'Westerlo',   lat:51.0897, lng:4.9161, rank:2 }
];
const LINKS = [
  ['Heist-op-den-Berg','Putte',1],['Heist-op-den-Berg','Booischot',1],['Booischot','Westerlo',1],
  ['Westerlo','Geel',1],['Heist-op-den-Berg','Berlaar',1],['Berlaar','Lier',1],['Lier','Nijlen',2],
  ['Nijlen','Herenthout',2],['Herenthout','Herentals',2],['Herentals','Geel',1],
  ['Putte','Bonheiden',2],['Bonheiden','Mechelen',1],['Mechelen','Keerbergen',2],
  ['Keerbergen','Tremelo',2],['Tremelo','Begijnendijk',2],['Begijnendijk','Aarschot',1],
  ['Aarschot','Rotselaar',2],['Rotselaar','Haacht',2],['Haacht','Keerbergen',2],
  ['Heist-op-den-Berg','Begijnendijk',2],['Herenthout','Heist-op-den-Berg',2],['Aarschot','Westerlo',2]
];
const townByName = n => TOWNS.find(t => t.n === n);

const MapEngine = {
  el:null, canvas:null, ctx:null, layer:null,
  center:{ lat:51.0680, lng:4.7250 }, zoom:11.2,
  tilesOK:true, tileFails:0, cache:new Map(), markers:[], onSelect:null, onLongPress:null,
  dpr: Math.min(window.devicePixelRatio || 1, 2),

  mount(el, layer) {
    this.el = el; this.layer = layer;
    this.canvas = $('#mapCanvas', el); this.ctx = this.canvas.getContext('2d');
    this.resize(); this.bind(); this.draw(); this.renderMarkers();
    if (!this._ro) { this._ro = new ResizeObserver(() => { this.resize(); this.draw(); this.renderMarkers(); }); }
    this._ro.observe(el);
  },
  resize() {
    const r = this.el.getBoundingClientRect();
    this.w = r.width; this.h = r.height;
    this.canvas.width = Math.round(r.width * this.dpr);
    this.canvas.height = Math.round(r.height * this.dpr);
    this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
  },
  /* --- projectie --- */
  worldSize(z) { return 256 * Math.pow(2, z); },
  project(lat, lng, z) {
    const s = this.worldSize(z);
    const x = (lng + 180) / 360 * s;
    const sin = Math.sin(lat * Math.PI / 180);
    const y = (0.5 - Math.log((1 + sin) / (1 - sin)) / (4 * Math.PI)) * s;
    return { x, y };
  },
  unproject(x, y, z) {
    const s = this.worldSize(z);
    const lng = x / s * 360 - 180;
    const n = Math.PI - 2 * Math.PI * y / s;
    const lat = 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
    return { lat, lng };
  },
  screenOf(lat, lng) {
    const c = this.project(this.center.lat, this.center.lng, this.zoom);
    const p = this.project(lat, lng, this.zoom);
    return { x: p.x - c.x + this.w / 2, y: p.y - c.y + this.h / 2 };
  },
  latLngAt(sx, sy) {
    const c = this.project(this.center.lat, this.center.lng, this.zoom);
    return this.unproject(c.x + sx - this.w / 2, c.y + sy - this.h / 2, this.zoom);
  },
  metersPerPx() { return 156543.03392 * Math.cos(this.center.lat * Math.PI / 180) / Math.pow(2, this.zoom); },

  /* --- tekenen --- */
  draw() {
    const { ctx, w, h } = this;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#0D0B09'; ctx.fillRect(0, 0, w, h);
    if (this.tilesOK) this.drawTiles();
    this.drawVector(!this.tilesOK);
    this.drawVignette();
    this.updateScale();
  },
  drawTiles() {
    const zi = clamp(Math.round(this.zoom), 9, 16);
    const scale = Math.pow(2, this.zoom - zi);
    const size = 256 * scale;
    const c = this.project(this.center.lat, this.center.lng, zi);
    const originX = c.x * scale - this.w / 2, originY = c.y * scale - this.h / 2;
    const x0 = Math.floor(originX / size), x1 = Math.floor((originX + this.w) / size);
    const y0 = Math.floor(originY / size), y1 = Math.floor((originY + this.h) / size);
    const max = Math.pow(2, zi);
    this.ctx.save(); this.ctx.globalAlpha = .88;
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
      if (y < 0 || y >= max) continue;
      const tx = ((x % max) + max) % max;
      const img = this.tile(zi, tx, y);
      if (img && img.complete && img.naturalWidth) {
        this.ctx.drawImage(img, Math.round(x * size - originX), Math.round(y * size - originY),
          Math.ceil(size), Math.ceil(size));
      }
    }
    this.ctx.restore();
    /* warme filmische grade over de tegels */
    this.ctx.save();
    this.ctx.globalCompositeOperation = 'multiply';
    this.ctx.fillStyle = 'rgba(70,45,22,.55)'; this.ctx.fillRect(0, 0, this.w, this.h);
    this.ctx.globalCompositeOperation = 'source-over';
    this.ctx.fillStyle = 'rgba(11,9,7,.34)'; this.ctx.fillRect(0, 0, this.w, this.h);
    this.ctx.restore();
  },
  tile(z, x, y) {
    const k = z + '/' + x + '/' + y;
    if (this.cache.has(k)) return this.cache.get(k);
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => { this.tileFails = 0; this.draw(); };
    img.onerror = () => {
      this.tileFails++;
      if (this.tileFails >= 4 && this.tilesOK) {
        this.tilesOK = false;
        const b = $('#mapMode'); if (b) b.textContent = 'Vector';
        this.draw();
      }
    };
    img.src = TILE_URL(z).replace('{x}', x).replace('{y}', y);
    this.cache.set(k, img);
    return img;
  },
  /* Eigen vectorlaag: echte coördinaten, schematische verbindingen */
  drawVector(asBase) {
    const { ctx } = this;
    if (asBase) {
      const g = ctx.createLinearGradient(0, 0, 0, this.h);
      g.addColorStop(0, '#12100D'); g.addColorStop(1, '#0A0806');
      ctx.fillStyle = g; ctx.fillRect(0, 0, this.w, this.h);
      ctx.save(); ctx.globalAlpha = .18; ctx.strokeStyle = '#3A2E1C'; ctx.lineWidth = 1;
      const step = 46 * Math.pow(2, this.zoom - 11);
      const off = this.screenOf(51.0764, 4.7283);
      for (let x = off.x % step; x < this.w; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.h); ctx.stroke(); }
      for (let y = off.y % step; y < this.h; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.w, y); ctx.stroke(); }
      ctx.restore();
    }
    ctx.save();
    LINKS.forEach(([a, b, cls]) => {
      const ta = townByName(a), tb = townByName(b); if (!ta || !tb) return;
      const pa = this.screenOf(ta.lat, ta.lng), pb = this.screenOf(tb.lat, tb.lng);
      ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y);
      ctx.strokeStyle = cls === 1 ? 'rgba(201,163,78,.55)' : 'rgba(201,163,78,.26)';
      ctx.lineWidth = cls === 1 ? 2.1 : 1.2; ctx.lineCap = 'round'; ctx.stroke();
    });
    TOWNS.forEach(t => {
      const p = this.screenOf(t.lat, t.lng);
      if (p.x < -60 || p.x > this.w + 60 || p.y < -30 || p.y > this.h + 30) return;
      if (t.rank === 2 && this.zoom < 10.4) return;
      ctx.beginPath(); ctx.arc(p.x, p.y, t.rank === 1 ? 3.2 : 2.1, 0, 7);
      ctx.fillStyle = t.rank === 1 ? 'rgba(246,236,223,.9)' : 'rgba(246,236,223,.55)'; ctx.fill();
      ctx.font = `${t.rank === 1 ? 600 : 500} ${t.rank === 1 ? 12 : 10.5}px Montserrat, sans-serif`;
      ctx.fillStyle = t.rank === 1 ? 'rgba(246,236,223,.94)' : 'rgba(246,236,223,.6)';
      ctx.textAlign = 'center';
      ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 6;
      ctx.fillText(t.n, p.x, p.y - 8);
      ctx.shadowBlur = 0;
    });
    ctx.restore();
  },
  drawVignette() {
    const { ctx } = this;
    const g = ctx.createRadialGradient(this.w / 2, this.h / 2, this.h * .35, this.w / 2, this.h / 2, this.h * .95);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(6,5,4,.62)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, this.w, this.h);
  },
  updateScale() {
    const el = $('#mapScale'); if (!el) return;
    const mpp = this.metersPerPx();
    const targets = [100, 200, 500, 1000, 2000, 5000, 10000];
    let best = targets[0];
    targets.forEach(t => { if (Math.abs(t / mpp - 74) < Math.abs(best / mpp - 74)) best = t; });
    el.querySelector('.rule').style.width = Math.round(best / mpp) + 'px';
    el.querySelector('.lab').textContent = best >= 1000 ? (best / 1000) + ' km' : best + ' m';
  },

  /* --- markers --- */
  setMarkers(pins) { this.markers = pins; this.renderMarkers(); },
  renderMarkers() {
    if (!this.layer) return;
    this.layer.innerHTML = this.markers.map(p => {
      const s = this.screenOf(p.lat, p.lng);
      if (s.x < -60 || s.x > this.w + 60 || s.y < -80 || s.y > this.h + 60) return '';
      const sel = S.ui.selectedPin === p.id;
      return `<button class="mk ${sel ? 'sel' : ''} ${p.state === 'completed' ? 'done' : ''} ${p.state === 'locked' ? 'locked' : ''}"
        style="left:${s.x}px;top:${s.y}px" data-pin="${p.id}"
        aria-label="${esc(p.title)} — ${PIN_META[p.type].label}">${markerSvg(p, sel)}</button>`;
    }).join('');
  },
  /* --- interactie --- */
  bind() {
    const el = this.el; let pts = new Map(), moved = 0, lastDist = 0, lpTimer = null, start = null;
    const cancelLP = () => { clearTimeout(lpTimer); lpTimer = null; };

    el.addEventListener('pointerdown', e => {
      if (e.target.closest('.mk') || e.target.closest('.map-ctl')) return;
      el.setPointerCapture(e.pointerId);
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved = 0; start = { x: e.clientX, y: e.clientY };
      if (pts.size === 1) {
        cancelLP();
        lpTimer = setTimeout(() => {
          const r = el.getBoundingClientRect();
          const ll = this.latLngAt(start.x - r.left, start.y - r.top);
          if (navigator.vibrate) navigator.vibrate(12);
          this.onLongPress && this.onLongPress(ll);
          pts.clear();
        }, 550);
      }
    });
    el.addEventListener('pointermove', e => {
      if (!pts.has(e.pointerId)) return;
      const prev = pts.get(e.pointerId);
      const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      moved += Math.abs(dx) + Math.abs(dy);
      if (moved > 8) cancelLP();
      if (pts.size === 1) {
        this.panBy(-dx, -dy);
      } else if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (lastDist) this.zoomBy(Math.log2(d / lastDist));
        lastDist = d;
      }
    });
    const up = e => { pts.delete(e.pointerId); lastDist = 0; cancelLP(); };
    el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    el.addEventListener('wheel', e => { e.preventDefault(); this.zoomBy(-e.deltaY * 0.0022); }, { passive:false });
  },
  panBy(dx, dy) {
    const c = this.project(this.center.lat, this.center.lng, this.zoom);
    const ll = this.unproject(c.x + dx, c.y + dy, this.zoom);
    this.center = { lat: clamp(ll.lat, 50.5, 51.6), lng: clamp(ll.lng, 4.0, 5.5) };
    this.draw(); this.renderMarkers();
  },
  zoomBy(d) { this.setZoom(this.zoom + d); },
  setZoom(z) { this.zoom = clamp(z, 9.5, 16); this.draw(); this.renderMarkers(); },
  flyTo(lat, lng, z) {
    this.center = { lat, lng }; if (z) this.zoom = clamp(z, 9.5, 16);
    this.draw(); this.renderMarkers();
  }
};

/* Markerdefinitie — eigen iconenset, geen game-assets */
const PIN_META = {
  home:        { label:'Home Base',    icon:'home',  fill:'#1B3A2B', stroke:'#4FBF8B', glyph:'#9BE8C4' },
  main:        { label:'Main Mission', icon:'target',fill:'#3A2A0E', stroke:'#C9A34E', glyph:'#F6ECDF' },
  side:        { label:'Side Quest',   icon:'flag',  fill:'#241D12', stroke:'#8A6C2A', glyph:'#E4C782' },
  boss:        { label:'Boss Mission', icon:'shield',fill:'#3A0F20', stroke:'#F05252', glyph:'#FFD7D7' },
  contact:     { label:'Contact',      icon:'users', fill:'#221E19', stroke:'#F6ECDF', glyph:'#F6ECDF' },
  company:     { label:'Bedrijf',      icon:'build', fill:'#2E1D0C', stroke:'#FF9A3C', glyph:'#FFD9AE' },
  event:       { label:'Event',        icon:'cal',   fill:'#2A220E', stroke:'#C9A34E', glyph:'#F6ECDF' },
  opportunity: { label:'Opportuniteit',icon:'gem',   fill:'#16291F', stroke:'#4FBF8B', glyph:'#BFF0D7' },
  saved:       { label:'Eigen pin',    icon:'bookmark', fill:'#2B1A0B', stroke:'#FF9A3C', glyph:'#FFD9AE' }
};
function markerSvg(p, selected) {
  const m = PIN_META[p.type] || PIN_META.saved;
  const glow = (p.state === 'active' || selected)
    ? `<circle class="glow" cx="19" cy="16" r="17" fill="${m.stroke}" opacity=".3"/>` : '';
  const lock = p.state === 'locked'
    ? `<g transform="translate(13,10) scale(.55)" stroke="${m.glyph}" fill="none" stroke-width="2.4"
         stroke-linecap="round"><path d="${P.lock}"/></g>` : '';
  return `<svg viewBox="0 0 38 46">${glow}
    <path d="M19 45C19 45 34 28.5 34 17A15 15 0 1 0 4 17C4 28.5 19 45 19 45Z"
      fill="${m.fill}" stroke="${m.stroke}" stroke-width="${selected ? 2.6 : 1.8}"/>
    ${p.state === 'locked' ? lock : `<g transform="translate(9,6) scale(.84)" stroke="${m.glyph}" fill="none"
      stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[m.icon]}"/></g>`}
    ${p.state === 'completed' ? `<circle cx="30" cy="30" r="7" fill="#0B0907" stroke="${m.stroke}" stroke-width="1.4"/>
      <path d="M27 30l2 2 4-4.4" stroke="${m.stroke}" stroke-width="1.8" fill="none" stroke-linecap="round"/>` : ''}
  </svg>`;
}

/* Alle pins = missies + contacten + bedrijven + eigen pins */
function allPins() {
  const out = [];
  S.pins.forEach(p => out.push(p));
  S.missions.forEach(m => {
    if (!m.location) return;
    const type = m.kind === 'boss' ? 'boss' : m.kind === 'main' ? 'main'
      : m.kind === 'event' ? 'event' : m.kind === 'opportunity' ? 'opportunity' : 'side';
    out.push({ id:'mp-' + m.id, title:m.title, type, lat:m.location.lat, lng:m.location.lng,
      missionId:m.id, kind:'mission',
      state: m.status === 'completed' ? 'completed' : m.status === 'locked' ? 'locked'
        : m.id === S.ui.activeMissionId ? 'active' : 'default' });
  });
  S.contacts.forEach(c => out.push({ id:'cp-' + c.id, title:c.name, type:'contact',
    lat:c.lat, lng:c.lng, contactId:c.id, kind:'contact', state:'default' }));
  S.companies.forEach(c => out.push({ id:'kp-' + c.id, title:c.name, type:'company',
    lat:c.lat, lng:c.lng, kind:'company', state:'default' }));
  return out;
}
function filterPins(pins, f) {
  if (f === 'all') return pins;
  if (f === 'missions') return pins.filter(p => p.kind === 'mission' || p.type === 'home');
  if (f === 'contacts') return pins.filter(p => p.kind === 'contact');
  if (f === 'companies') return pins.filter(p => p.kind === 'company');
  if (f === 'events') return pins.filter(p => p.type === 'event');
  if (f === 'mine') return pins.filter(p => p.custom);
  return pins;
}

function mountMap() {
  const wrap = $('#mapWrap'); if (!wrap) return;
  MapEngine.mount(wrap, $('#markerLayer'));
  MapEngine.setMarkers(filterPins(allPins(), S.ui.mapFilter));
  MapEngine.onLongPress = ll => openPinSheet(ll);
  $('#markerLayer').addEventListener('click', e => {
    const b = e.target.closest('[data-pin]'); if (!b) return;
    const pin = MapEngine.markers.find(p => p.id === b.dataset.pin); if (!pin) return;
    S.ui.selectedPin = pin.id; MapEngine.renderMarkers();
    openMarkerSheet(pin);
  });
  const s = $('#mapSearch');
  s && s.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const q = s.value.trim().toLowerCase(); if (!q) return;
    const hit = allPins().find(p => p.title.toLowerCase().includes(q))
      || TOWNS.find(t => t.n.toLowerCase().includes(q));
    if (!hit) { toast('Niets gevonden voor “' + s.value + '”'); return; }
    MapEngine.flyTo(hit.lat, hit.lng, 13);
    if (hit.id) { S.ui.selectedPin = hit.id; MapEngine.renderMarkers(); openMarkerSheet(hit); }
  });
}

function nyxReply(q) {
  const t = q.toLowerCase();
  const m = featuredMission();
  if (/vandaag|today|doen/.test(t))
    return `Eén ding: objectief 3 van ${m.title}. Iemand fysiek ontmoeten weegt zwaarder dan drie berichten. Zet het vandaag nog in de agenda.`;
  if (/network|netwerk/.test(t))
    return 'Network staat op 86, maar uw bereik blijft binnen dezelfde cirkel. U spreekt mensen die u al kent. Connectors — mensen met eigen kringen — ontbreken. Daarom stel ik de missie hieronder voor.';
  if (/impact|move|hefboom|belangrijk/.test(t))
    return 'Bel Pieter vandaag en bied aan zijn capaciteitsprobleem uit te tekenen. Waarde vooraf, zonder factuur. Dat is de goedkoopste manier om een connector te maken.';
  if (/geld|omzet|tarief|prijs/.test(t))
    return 'U zit op €64.800 van €100K in hoofdstuk I. Op €180/u is dat 196 uur. Sneller gaat enkel via retainers of via een tweede klant op hetzelfde aanbod.';
  if (/pin|kaart|map/.test(t))
    return 'Zet een pin op elke plek waar u iemand ontmoet hebt. Na drie maanden ziet u waar uw netwerk echt zit — en waar het gat is.';
  return 'Genoteerd. Zet het om in een missie met één meetbaar doel en één bewijsstuk, anders blijft het een intentie.';
}

        <span class="eyebrow ${m.from === 'me' ? 'muted' : ''}">${m.from === 'me' ? 'U' : 'Nyx'}</span>
        <p class="body" style="margin:5px 0 0;color:var(--ink-1)">${esc(m.text)}</p></div>`).join('')}
    </div>

    <div class="chiprow" style="padding:0 0 12px">
      ${NYX_SHORTCUTS.map(s => `<button class="chip" data-action="nyx-ask" data-q="${esc(s)}">${esc(s)}</button>`).join('')}
    </div>

    ${sug ? `<div class="card" style="border-color:rgba(201,163,78,.4)">
      <span class="eyebrow">Voorgestelde missie</span>
      <h3 class="display d-md" style="margin:7px 0 8px">${esc(sug.title)}</h3>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px">
        ${Tag(sug.duration,'alt')}${Tag('Difficulty: ' + sug.difficulty,'alt')}${Tag('+' + sug.xp + ' XP')}${Tag(sug.impact,'alt')}
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-gold btn-sm" style="flex:1" data-action="accept-sug" data-id="${sug.id}">Accept</button>
        <button class="btn btn-ghost btn-sm" data-action="edit-sug" data-id="${sug.id}">Edit</button>
        <button class="btn btn-quiet btn-sm" data-action="ignore-sug" data-id="${sug.id}">Ignore</button>
      </div>
    </div>` : `<p class="body">Geen open voorstellen. Vraag iets en ik maak er een missie van.</p>`}
  </div>
  <div class="sheet-foot">
    <div style="display:flex;gap:8px">
      <input id="nyxInput" class="input" placeholder="Vraag Nyx iets…" aria-label="Bericht aan Nyx">
      <button class="btn btn-gold btn-icon" data-action="nyx-send" aria-label="Versturen">${ico('send',17,2.1)}</button>
    </div>
  </div>`;
}
function openNyx(ctx) {
  openSheet(NyxSheetHTML(ctx), 'Nyx mission control');
  const i = $('#nyxInput');
  i && i.addEventListener('keydown', e => { if (e.key === 'Enter') nyxSend(); });
}
function nyxAsk(q) {
  nyxLog.push({ from:'me', text:q });
  nyxLog.push({ from:'nyx', text: nyxReply(q) });
  openNyx();
  const log = $('#nyxLog'); if (log) log.lastElementChild.scrollIntoView({ block:'nearest' });
}
function nyxSend() { const i = $('#nyxInput'); if (!i || !i.value.trim()) return; nyxAsk(i.value.trim()); }
</script>

const sheetEl = $('#sheet'), scrimEl = $('#scrim');
function openSheet(html, label) {
  sheetEl.setAttribute('aria-label', label || 'Detail');
  sheetEl.innerHTML = '<div class="grip"></div>' + html;
  sheetEl.hidden = false; scrimEl.hidden = false;
  requestAnimationFrame(() => { scrimEl.classList.add('open'); sheetEl.classList.add('open'); animateBars(sheetEl); });
}
function closeSheet() {
  sheetEl.classList.remove('open'); scrimEl.classList.remove('open');
  setTimeout(() => { sheetEl.hidden = true; scrimEl.hidden = true; sheetEl.innerHTML = ''; }, 260);
}
const HOME_BASE = { lat:51.0764, lng:4.7283 };
function distanceKm(a, b) {
  const R = 6371, dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  const s = Math.sin(dLat/2) ** 2 + Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) * Math.sin(dLng/2) ** 2;
  return Math.round(2 * R * Math.asin(Math.sqrt(s)) * 10) / 10;
}

function openMarkerSheet(pin) {
  const meta = PIN_META[pin.type] || PIN_META.saved;
  const m = pin.missionId ? missionById(pin.missionId) : null;
  const c = pin.contactId ? contactById(pin.contactId) : null;
  const dist = distanceKm(HOME_BASE, pin);
  let body = '';
  if (m) {
    body = `
      <div style="display:flex;gap:12px;margin-bottom:12px">
        <span style="width:104px;height:104px;flex:0 0 auto;position:relative">${plate(m.kind === 'event' ? 'city' : 'mission','fill')}</span>
        <span style="flex:1;min-width:0">
          <span class="eyebrow" style="color:${meta.stroke}">${meta.label}</span>
          <h2 class="display d-lg" style="margin:6px 0 4px">${esc(m.title)}</h2>
          <p class="meta" style="margin:0 0 6px">${ico('pin',11,2)} ${esc(m.location.address || m.location.name)}</p>
          <p class="body" style="margin:0;font-size:12.5px">${esc(m.why.split('.')[0])}.</p>
        </span>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px">
        ${Tag(m.when || m.estimate,'alt')}${Tag(m.people.length + ' contacten','alt')}${Tag('+' + m.xp + ' XP')}${Tag(dist + ' km van Home Base','alt')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gold" style="flex:1 1 130px" data-action="go-mission" data-id="${m.id}">View mission</button>
        <button class="btn btn-ghost" data-action="route" data-lat="${pin.lat}" data-lng="${pin.lng}">${ico('nav',14,2.2)} Route</button>
        <button class="btn btn-ghost" data-action="note-for" data-title="${esc(m.title)}">${ico('file',14,2.2)} Add note</button>
      </div>`;
  } else if (c) {
    body = `
      <span class="eyebrow" style="color:${meta.stroke}">${meta.label}</span>
      <h2 class="display d-lg" style="margin:6px 0 4px">${esc(c.name)}</h2>
      <p class="body" style="margin:0 0 8px">${esc(c.role)}${c.note ? ' — ' + esc(c.note) : ''}</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px">
        ${Tag(c.tier,'alt')}${Tag(dist + ' km van Home Base','alt')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gold" style="flex:1 1 130px" data-action="note-for" data-title="Gesprek met ${esc(c.name)}">Notitie toevoegen</button>
        <button class="btn btn-ghost" data-action="route" data-lat="${pin.lat}" data-lng="${pin.lng}">${ico('nav',14,2.2)} Route</button>
      </div>`;
  } else {
    body = `
      <span class="eyebrow" style="color:${meta.stroke}">${meta.label}</span>
      <h2 class="display d-lg" style="margin:6px 0 4px">${esc(pin.title)}</h2>
      ${pin.note ? `<p class="body" style="margin:0 0 8px">${esc(pin.note)}</p>` : ''}
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px">
        ${Tag(pin.lat.toFixed(4) + ', ' + pin.lng.toFixed(4),'alt')}${Tag(dist + ' km van Home Base','alt')}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-gold" style="flex:1 1 120px" data-action="note-for" data-title="${esc(pin.title)}">Notitie</button>
        <button class="btn btn-ghost" data-action="route" data-lat="${pin.lat}" data-lng="${pin.lng}">${ico('nav',14,2.2)} Route</button>
        ${pin.custom ? `<button class="btn btn-quiet" data-action="del-pin" data-id="${pin.id}">Verwijder</button>` : ''}
      </div>`;
  }
  openSheet(`<div class="sheet-body">${body}</div>`, pin.title);
}

let newPinType = 'saved', newPinLL = null;

  openSheet(`<div class="sheet-body">
    <h2 class="display d-md" style="margin:0 0 3px">Nieuwe pin</h2>
    <p class="meta" style="margin:0 0 14px">${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)} · ${distanceKm(HOME_BASE, ll)} km van Home Base</p>
    <div class="field"><label for="pinTitle">Titel</label>
      <input id="pinTitle" class="input" placeholder="Bv. Locatie bezocht met Kevin"></div>
    <div class="field"><label>Type pin</label>
      <div class="seg" id="pinTypes">${types.map(t => `<button class="${t === 'saved' ? 'is-on' : ''}"
        data-action="pin-type" data-value="${t}">${PIN_META[t].label}</button>`).join('')}</div></div>

      <div class="field"><label for="pinMission">Missie koppelen</label>
        <select id="pinMission" class="input"><option value="">—</option>
          ${S.missions.filter(m => m.status !== 'completed').map(m => `<option value="${m.id}">${esc(m.title)}</option>`).join('')}</select></div>
    </div>
  </div>
  <div class="sheet-foot" style="display:flex;gap:8px">

  setTimeout(() => $('#pinTitle') && $('#pinTitle').focus(), 300);
}
function savePin() {
  const title = ($('#pinTitle').value || '').trim() || 'Eigen pin';
  const p = addPin({
    title, type:newPinType, lat:newPinLL.lat, lng:newPinLL.lng,
    note: ($('#pinNote').value || '').trim(),
    contactId: $('#pinContact').value || undefined,
    missionId: $('#pinMission').value || undefined,
    state:'default'
  });
  closeSheet();
  S.ui.mapFilter = 'mine'; S.ui.selectedPin = p.id;
  if (location.hash.startsWith('#/map')) {
    render();
    setTimeout(() => { MapEngine.flyTo(p.lat, p.lng); }, 60);
  } else { location.hash = '#/map'; }
  toast('Pin opgeslagen');
}

        <span style="flex:1"><b style="font-size:13px">${esc(m.title)}</b>
          <span class="meta" style="display:block">+${m.statReward.amount} ${key} · +${m.xp} XP</span></span>
        <span style="color:var(--ink-3)">${ico('right',15,2.2)}</span></button>`).join('')
      : '<p class="body">Geen open missie voor deze stat. Vraag Nyx om er een voor te stellen.</p>'}</div>
  </div>`, s.label);
}
const STAT_NOTE = {
  capital:'Wat u bezit minus wat u schuldig bent. Stijgt door marge, niet door omzet.',
  income:'Herhaalbare inkomsten per maand. Eén klant meer telt minder dan één klant die blijft.',
  ownership:'Het deel van de waarde dat van u blijft als u stopt met werken.',
  network:'Bereik buiten uw eigen cirkel. Connectors tellen zwaarder dan contacten.',
  authority:'Of mensen u vinden zonder dat u belt. Content en resultaten voeden dit.',
  strategy:'Hoe scherp de keuzes zijn. Minder richtingen is hier hoger.',
  execution:'Wat er werkelijk afgewerkt raakt per week.',
  optionality:'Hoeveel deuren openstaan als één pad wegvalt. Uw zwakste stat.'
};
function openMapFilterSheet() {
  openSheet(`<div class="sheet-body">
    <h2 class="display d-md" style="margin:0 0 12px">Filters</h2>
    <div class="stack">${MAP_FILTERS.map(f => `
      <button class="card flat tap" style="display:flex;gap:11px;align-items:center;text-align:left"
        data-action="map-filter" data-value="${f.k}">
        <span style="color:var(--gold)">${ico(f.icon,17,2)}</span>
        <b style="flex:1;font-size:13px">${f.label}</b>
        ${S.ui.mapFilter === f.k ? `<span style="color:var(--gold)">${ico('check',17,2)}</span>` : ''}
      </button>`).join('')}</div>
  </div>`, 'Kaartfilters');
}

/* =================================================================================
   [Q] ROUTER + EVENTS  ->  src/app/router.tsx
   ================================================================================= */
const NAV = [['home','Home','home'],['map','Map','map'],['missions','Missions','target'],
             ['journal','Journal','book'],['profile','Profile','user']];
const TAB_OF = { home:'home', map:'map', missions:'missions', mission:'missions',
                 journal:'journal', wrap:'journal', profile:'profile' };
function renderNav(active) {
  $('#nav').innerHTML = NAV.map(([k, l, i]) => `
    <button data-go="#/${k}" ${active === k ? 'aria-current="page"' : ''}>
      ${ico(i, 22, active === k ? 2.1 : 1.7)}<span>${l}</span></button>`).join('');
}
function parseRoute() {
  const h = (location.hash || '#/home').replace(/^#\/?/, '');
  const [name, param] = h.split('/');
  return { name: name || 'home', param };
}
let pendingMapFocus = null;
function render() {
  const r = parseRoute();
  const view = $('#view');
  const html =
    r.name === 'map' ? MapScreen() :
    r.name === 'missions' ? MissionsScreen() :
    r.name === 'mission' ? MissionDetail(r.param) :
    r.name === 'journal' ? JournalScreen() :
    r.name === 'wrap' ? WrapScreen(r.param) :
    r.name === 'profile' ? ProfileScreen() : HomeScreen();
  view.innerHTML = html;
  renderNav(TAB_OF[r.name] || 'home');
  animateBars(view);
  if (r.name === 'map') {
    mountMap();
    if (pendingMapFocus) {
      const { lat, lng, id } = pendingMapFocus; pendingMapFocus = null;
      setTimeout(() => {
        MapEngine.flyTo(lat, lng, 13);
        if (id) { S.ui.selectedPin = id; MapEngine.renderMarkers();
          const p = MapEngine.markers.find(x => x.id === id); p && openMarkerSheet(p); }
      }, 80);
    }
  }
  if (r.name === 'journal') mountJournal();
  window.scrollTo({ top: 0 });
}

/* Eén gedelegeerde handler — in React worden dit gewoon onClick-props */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  const act = e.target.closest('[data-action]');
  if (act) { e.stopPropagation(); handleAction(act.dataset.action, act); return; }
  if (go) { location.hash = go.dataset.go; return; }
});
document.addEventListener('change', e => {
  const cb = e.target.closest('[data-action="toggle-obj"]'); if (!cb) return;
  toggleObjective(cb.dataset.mission, cb.dataset.obj);
  render();
});
$('#scrim').addEventListener('click', closeSheet);
$('#nyxFab').addEventListener('click', () => openNyx());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });

function handleAction(a, el) {
  const id = el.dataset.id;
  switch (a) {
    case 'back': history.length > 1 ? history.back() : (location.hash = '#/missions'); break;

    /* Missies */
    case 'continue': {
      const r = parseRoute();
      if (r.name === 'mission' && r.param === id) {
        const m = missionById(id);
        const next = m.objectives.find(o => !o.optional && !o.done);
        if (next) { toggleObjective(id, next.id); toast('Objectief afgevinkt · ' + next.label); render(); }
        else { completeMission(id); render(); }
      } else { S.ui.activeMissionId = id; location.hash = '#/mission/' + id; }
      break;
    }
    case 'go-mission': closeSheet(); location.hash = '#/mission/' + id; break;
    case 'activate': {
      const m = missionById(id); if (!m) break;
      m.status = 'active'; S.ui.activeMissionId = m.id; persist(); render();
      toast('Missie geactiveerd'); break;
    }
    case 'start-suggested': {
      const m = missionById('m-lunch');
      if (m && m.status === 'suggested') { m.status = 'active'; persist(); }
      S.ui.activeMissionId = 'm-lunch'; location.hash = '#/mission/m-lunch'; break;
    }
    case 'open-on-map': {
      const m = missionById(id); if (!m || !m.location) break;
      S.ui.mapFilter = 'all';
      pendingMapFocus = { lat:m.location.lat, lng:m.location.lng, id:'mp-' + m.id };
      location.hash = '#/map'; break;
    }
    case 'focus-contact': {
      const c = contactById(id); if (!c) break;
      S.ui.mapFilter = 'all';
      pendingMapFocus = { lat:c.lat, lng:c.lng, id:'cp-' + c.id };
      location.hash = '#/map'; break;
    }
    case 'focus-pin': {
      const p = allPins().find(x => x.id === id); if (!p) break;
      MapEngine.flyTo(p.lat, p.lng, 13);
      S.ui.selectedPin = p.id; MapEngine.renderMarkers(); openMarkerSheet(p); break;
    }
    case 'mission-filter': S.ui.missionFilter = el.dataset.value; render(); break;

    /* Kaart */
    case 'map-filter':
      S.ui.mapFilter = el.dataset.value; closeSheet(); render(); break;
    case 'map-filters': openMapFilterSheet(); break;
    case 'map-zoom': MapEngine.zoomBy(+el.dataset.value * 0.8); break;
    case 'map-home': MapEngine.flyTo(HOME_BASE.lat, HOME_BASE.lng, 11.6); toast('Terug naar Home Base'); break;
    case 'map-layers':
      MapEngine.tilesOK = !MapEngine.tilesOK; MapEngine.tileFails = 0;
      $('#mapMode').textContent = MapEngine.tilesOK ? 'Satelliet-raster' : 'Vector';
      MapEngine.draw(); break;
    case 'new-pin': openPinSheet(MapEngine.center); break;
    case 'pin-type':
      newPinType = el.dataset.value;
      $$('#pinTypes button').forEach(b => b.classList.toggle('is-on', b === el)); break;
    case 'save-pin': savePin(); break;
    case 'del-pin': removePin(id); closeSheet(); render(); toast('Pin verwijderd'); break;
    case 'route': {
      const d = distanceKm(HOME_BASE, { lat:+el.dataset.lat, lng:+el.dataset.lng });
      MapEngine.flyTo(+el.dataset.lat, +el.dataset.lng, 13);
      closeSheet(); toast(`${d} km vanaf Home Base · route opent in Maps in de echte app`); break;
    }

    /* Journal */
    case 'journal-filter': S.ui.journalFilter = el.dataset.value; render(); break;
    case 'day': S.ui.dayOffset = (S.ui.dayOffset || 0) + (+el.dataset.value); S.ui.journalFilter = 'today'; render(); break;
    case 'save-note': saveQuickNote(); break;
    case 'attach': {
      const kinds = ['meet','city','room','note','gym'];
      pendingMedia.push({ kind: kinds[pendingMedia.length % kinds.length], label:'Beeld' });
      toast(pendingMedia.length + ' beeld' + (pendingMedia.length > 1 ? 'en' : '') + ' gekoppeld aan deze notitie'); break;
    }
    case 'voice': toast('Spraaknotities komen in de echte app — typ hier voorlopig'); break;
    case 'entry-menu': {
      openSheet(`<div class="sheet-body">
        <h2 class="display d-md" style="margin:0 0 12px">Entry</h2>
        <div class="stack">
          <button class="card flat tap" style="text-align:left" data-action="close-sheet">Bewerken (binnenkort)</button>
          <button class="card flat tap" style="text-align:left;color:var(--coral)" data-action="del-entry" data-id="${id}">Verwijderen</button>
        </div></div>`, 'Entry-opties'); break;
    }
    case 'del-entry':
      S.journal = S.journal.filter(j => j.id !== id); persist(); closeSheet(); render(); toast('Entry verwijderd'); break;
    case 'create-wrap': {
      const w = generateWrap(); location.hash = '#/wrap/' + w.id; toast('Wrap gegenereerd'); break;
    }

    /* Profiel + stats */
    case 'stat-detail': openStatSheet(el.dataset.key); break;
    case 'chapter-detail': openSheet(`<div class="sheet-body">
        <span class="eyebrow">Chapter ${S.user.chapter.roman}</span>
        <h2 class="display d-lg" style="margin:6px 0 10px">${esc(S.user.chapter.name)}</h2>
        <p class="body">Hoofdstuk I loopt van €0 tot €100.000 opgebouwde empire value. Het sluit wanneer de eerste €10K-maand een feit is.</p>
        <div style="margin:14px 0 8px">${Bar((S.user.chapter.economic.current) / S.user.chapter.economic.to * 100)}</div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink-3)">
          <span>€0</span><span style="color:var(--gold);font-weight:800">${eur(S.user.chapter.economic.current)}</span><span>€100K</span></div>
        <button class="btn btn-ghost btn-block" style="margin-top:14px" data-action="go-mission" data-id="m-boss10k">Bekijk de boss-missie</button>
      </div>`, 'Chapter'); break;
    case 'xp-detail': openSheet(`<div class="sheet-body">
        <span class="eyebrow">Lifetime XP</span>
        <h2 class="display d-lg" style="margin:6px 0 10px">${S.user.lifetimeXp.toLocaleString('nl-BE')} XP</h2>
        <p class="body">XP komt enkel uit voltooide objectieven met bewijs. Bezig zijn levert niets op; afgewerkte beweging wel.</p>
        <div style="margin:14px 0 6px">${Bar(S.user.xp / S.user.xpToNext * 100)}</div>
        <p class="meta">Level ${S.user.level} · nog ${(S.user.xpToNext - S.user.xp).toLocaleString('nl-BE')} XP tot level ${S.user.level + 1}</p>
      </div>`, 'XP'); break;
    case 'reset': resetDemo(); break;

    /* Nyx */
    case 'open-nyx': openNyx(id); break;
    case 'close-sheet': closeSheet(); break;
    case 'nyx-ask': nyxAsk(el.dataset.q); break;
    case 'nyx-send': nyxSend(); break;
    case 'accept-sug': {
      const m = acceptSuggestion(id); closeSheet();
      if (m) { S.ui.activeMissionId = m.id; location.hash = '#/missions'; render();
        toast('Missie toegevoegd · ' + m.title); }
      break;
    }
    case 'edit-sug': {
      const s = S.nyxSuggestions.find(x => x.id === id); if (!s) break;
      openSheet(`<div class="sheet-body">
        <h2 class="display d-md" style="margin:0 0 12px">Voorstel aanpassen</h2>
        <div class="field"><label for="sugTitle">Titel</label>
          <input id="sugTitle" class="input" value="${esc(s.title)}"></div>
        <div class="field"><label for="sugXp">XP</label>
          <input id="sugXp" class="input" type="number" value="${s.xp}"></div>
      </div>
      <div class="sheet-foot" style="display:flex;gap:8px">
        <button class="btn btn-quiet" data-action="close-sheet">Annuleer</button>
        <button class="btn btn-gold" style="flex:1" data-action="save-sug" data-id="${id}">Bewaar en accepteer</button>
      </div>`, 'Voorstel aanpassen');
      break;
    }
    case 'save-sug': {
      const s = S.nyxSuggestions.find(x => x.id === id); if (!s) break;
      s.title = ($('#sugTitle').value || s.title).toUpperCase();
      s.xp = +$('#sugXp').value || s.xp;
      const m = acceptSuggestion(id); closeSheet();
      if (m) { location.hash = '#/missions'; render(); toast('Missie toegevoegd · ' + m.title); }
      break;
    }
    case 'ignore-sug':
      S.nyxSuggestions = S.nyxSuggestions.filter(x => x.id !== id); persist();
      openNyx(); toast('Voorstel genegeerd'); break;
    case 'note-for': {
      closeSheet();
      setTimeout(() => {
        location.hash = '#/journal';
        setTimeout(() => { const ta = $('#qnote');
          if (ta) { ta.value = el.dataset.title + ' — '; ta.focus();
            ta.setSelectionRange(ta.value.length, ta.value.length); } }, 120);
      }, 180);
      break;
    }
  }
}

/* --- Init ----------------------------------------------------------------- */
$('#nyxAvatar').src = NYX_SRC;
window.addEventListener('hashchange', render);
if (!location.hash) location.hash = '#/home';
render();
setTimeout(() => $('#nyxFab').classList.remove('pulse'), 9000);
</script>
